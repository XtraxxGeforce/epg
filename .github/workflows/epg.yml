name: Update XMLTV EPG

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */1 * * *"

permissions:
  contents: write

jobs:
  update-epg:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and merge EPG
        run: |
          python3 <<'PY'
          import urllib.request
          import re
          from pathlib import Path

          sources = [
              "https://github.com/AqFad2811/epg/raw/refs/heads/main/unifitv.xml",
              "https://github.com/AqFad2811/epg/raw/refs/heads/main/rtmklik.xml",
              "https://github.com/AqFad2811/epg/raw/refs/heads/main/sooka.xml",
              "https://github.com/AqFad2811/epg/raw/refs/heads/main/epg.xml"
          ]

          channels = {}
          programmes = {}

          for url in sources:

              print("Downloading:", url)

              try:
                  req = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent": "Mozilla/5.0"
                      }
                  )

                  with urllib.request.urlopen(req, timeout=60) as response:
                      data = response.read().decode("utf-8", errors="ignore")

                  print("Size:", len(data))

              except Exception as e:
                  print("FAILED:", e)
                  continue

              # Remove XML declaration
              data = re.sub(
                  r'<\?xml[\s\S]*?\?>',
                  '',
                  data,
                  flags=re.I
              )

              # Extract channels
              channel_matches = re.findall(
                  r'<channel\b[\s\S]*?</channel>',
                  data,
                  flags=re.I
              )

              for channel in channel_matches:

                  match = re.search(
                      r'<channel[^>]*\bid=["\']([^"\']+)["\']',
                      channel,
                      flags=re.I
                  )

                  if not match:
                      continue

                  channel_id = match.group(1)

                  if channel_id not in channels:
                      channels[channel_id] = channel

              # Extract programmes
              programme_matches = re.findall(
                  r'<programme\b[\s\S]*?</programme>',
                  data,
                  flags=re.I
              )

              for programme in programme_matches:

                  channel_match = re.search(
                      r'<programme[^>]*\bchannel=["\']([^"\']+)["\']',
                      programme,
                      flags=re.I
                  )

                  start_match = re.search(
                      r'<programme[^>]*\bstart=["\']([^"\']+)["\']',
                      programme,
                      flags=re.I
                  )

                  if not channel_match or not start_match:
                      continue

                  channel_id = channel_match.group(1)
                  start = start_match.group(1)

                  key = channel_id + "|" + start

                  if key not in programmes:
                      programmes[key] = programme

          print("Channels:", len(channels))
          print("Programmes:", len(programmes))

          output = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<tv>'
          ]

          output.extend(channels.values())
          output.extend(programmes.values())

          output.append('</tv>')

          Path("merged.xml").write_text(
              "\n".join(output),
              encoding="utf-8"
          )

          print("Final XML size:",
                Path("merged.xml").stat().st_size)

          PY

      - name: Commit merged XML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add merged.xml

          git diff --cached --quiet || git commit -m "Update EPG"

          git push
